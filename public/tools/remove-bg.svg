<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0B0D11" stop-opacity="0.96" />
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <pattern id="alphaGrid3" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#252934" />
      <rect x="14" y="14" width="14" height="14" fill="#252934" />
      <rect x="14" width="14" height="14" fill="#151820" />
      <rect y="14" width="14" height="14" fill="#151820" />
    </pattern>
  </defs>

  <!-- Card Base -->
  <rect x="4" y="4" width="592" height="712" rx="28" fill="url(#cardBg3)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3" />
  <circle cx="300" cy="340" r="240" fill="url(#glow3)" />

  <!-- Top Category Pill -->
  <rect x="155" y="38" width="290" height="38" rx="19" fill="#A855F7" fill-opacity="0.15" stroke="#C084FC" stroke-opacity="0.6" stroke-width="1.5" />
  <circle cx="184" cy="57" r="6" fill="#C084FC" />
  <text x="312" y="63" font-family="sans-serif" font-weight="800" font-size="16" fill="#D8B4FE" text-anchor="middle" letter-spacing="1.5">TRANSPARENCIA PURA RGBA</text>

  <!-- Giant Title -->
  <text x="300" y="132" font-family="sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">QUITAR FONDO</text>
  <text x="300" y="168" font-family="sans-serif" font-weight="600" font-size="21" fill="#9CA3AF" text-anchor="middle">Recorte inteligente cuidando letras blancas</text>

  <!-- Central Visual Illustration: Split Before / After -->
  <!-- Left Half: Solid Dark Background -->
  <rect x="65" y="200" width="235" height="350" rx="16" fill="#1E222B" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
  <!-- Right Half: Transparent Checkerboard -->
  <rect x="300" y="200" width="235" height="350" rx="16" fill="url(#alphaGrid3)" stroke="#C084FC" stroke-opacity="0.7" stroke-width="2.5" />

  <!-- Center Divider Line -->
  <line x1="300" y1="190" x2="300" y2="560" stroke="#FFFFFF" stroke-width="4" />
  <circle cx="300" cy="375" r="24" fill="#FFFFFF" />
  <text x="300" y="382" font-family="sans-serif" font-weight="900" font-size="18" fill="#0B0D11" text-anchor="middle">↔</text>

  <!-- Center Graphic Across Split -->
  <polygon points="300,255 390,425 210,425" fill="#FFFFFF" stroke="#C084FC" stroke-width="4" stroke-linejoin="round" />
  <text x="300" y="402" font-family="sans-serif" font-weight="900" font-size="28" fill="#0B0D11" text-anchor="middle">DTF</text>

  <!-- Labels -->
  <rect x="95" y="485" width="175" height="42" rx="10" fill="#0D0E11" fill-opacity="0.85" />
  <text x="182" y="512" font-family="monospace" font-weight="800" font-size="15" fill="#9CA3AF" text-anchor="middle">CON FONDO</text>

  <rect x="330" y="485" width="175" height="42" rx="10" fill="#A855F7" fill-opacity="0.25" stroke="#C084FC" stroke-width="1.5" />
  <text x="417" y="512" font-family="monospace" font-weight="800" font-size="15" fill="#FFFFFF" text-anchor="middle">100% SIN FONDO</text>

  <!-- Bottom CTA Button -->
  <rect x="90" y="595" width="420" height="76" rx="20" fill="#FFFFFF" />
  <text x="300" y="642" font-family="sans-serif" font-weight="900" font-size="24" fill="#0A0B0E" text-anchor="middle" letter-spacing="1">QUITAR FONDO AHORA →</text>
</svg>
