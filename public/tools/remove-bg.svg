<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181D" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>
    <pattern id="gridAlpha" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#1A1C23" />
      <rect x="12" y="12" width="12" height="12" fill="#1A1C23" />
      <rect x="12" width="12" height="12" fill="#12141A" />
      <rect y="12" width="12" height="12" fill="#12141A" />
    </pattern>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad3)" />

  <rect x="40" y="40" width="520" height="520" rx="20" fill="#0D0E11" stroke="#20232A" stroke-width="2" />

  <!-- Split Screen: Left = Solid Background, Right = Clean Alpha -->
  <rect x="60" y="60" width="480" height="380" rx="14" fill="#1A1C23" stroke="#262A36" stroke-width="1.5" />
  
  <!-- Right half with transparency grid -->
  <path d="M 300 60 L 526 60 Q 540 60 540 74 L 540 426 Q 540 440 526 440 L 300 440 Z" fill="url(#gridAlpha)" />
  <line x1="300" y1="60" x2="300" y2="440" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Split Badges -->
  <rect x="80" y="80" width="100" height="32" rx="6" fill="#0D0E11" stroke="#333" />
  <text x="130" y="101" font-family="monospace" font-size="11" fill="#8E95A5" text-anchor="middle">FONDO OPACO</text>

  <rect x="320" y="80" width="130" height="32" rx="6" fill="#FFFFFF" />
  <text x="385" y="101" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000" text-anchor="middle">TRANSPARENCIA REAL</text>

  <!-- Graphic Emblem across center -->
  <circle cx="300" cy="250" r="85" fill="#FFFFFF" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="4" />
  <!-- Scissors Cut Line Icon -->
  <path d="M 270 230 L 330 270 M 270 270 L 330 230" stroke="#000000" stroke-width="8" stroke-linecap="round" />
  <circle cx="260" cy="225" r="14" fill="none" stroke="#000000" stroke-width="6" />
  <circle cx="260" cy="275" r="14" fill="none" stroke="#000000" stroke-width="6" />

  <!-- Technical Overlay Footer -->
  <rect x="60" y="460" width="480" height="80" rx="12" fill="#16181D" stroke="#20232A" stroke-width="1.5" />
  <text x="85" y="495" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">QUITAR FONDO INTELIGENTE</text>
  <text x="85" y="522" font-family="monospace" font-size="12" fill="#8E95A5">RESPETA LETRAS BLANCAS • CANAL RGBA PURO PARA DTF</text>

  <rect x="420" y="478" width="105" height="42" rx="8" fill="#FFFFFF" />
  <text x="472" y="504" font-family="sans-serif" font-weight="900" font-size="13" fill="#000000" text-anchor="middle">QUITAR</text>
</svg>
