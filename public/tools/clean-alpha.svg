<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0B0D11" stop-opacity="0.96" />
    </linearGradient>
    <radialGradient id="glow6" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Base -->
  <rect x="4" y="4" width="592" height="712" rx="28" fill="url(#cardBg6)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3" />
  <circle cx="300" cy="340" r="240" fill="url(#glow6)" />

  <!-- Top Category Pill -->
  <rect x="145" y="38" width="310" height="38" rx="19" fill="#06B6D4" fill-opacity="0.15" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5" />
  <circle cx="176" cy="57" r="6" fill="#22D3EE" />
  <text x="312" y="63" font-family="sans-serif" font-weight="800" font-size="16" fill="#67E8F9" text-anchor="middle" letter-spacing="1.5">ANTI-HALO DE TINTA BLANCA</text>

  <!-- Giant Title -->
  <text x="300" y="132" font-family="sans-serif" font-weight="900" font-size="45" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">LIMPIAR BORDES</text>
  <text x="300" y="168" font-family="sans-serif" font-weight="600" font-size="21" fill="#9CA3AF" text-anchor="middle">Elimina orillas blancas y manchas fantasma</text>

  <!-- Central Visual Illustration: Edge Contraction -->
  <rect x="65" y="200" width="470" height="350" rx="20" fill="#12151C" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" />

  <!-- Outer Halo Dashed Ring -->
  <circle cx="300" cy="340" r="105" fill="none" stroke="#6B7280" stroke-width="3" stroke-dasharray="10,8" />
  <!-- Inner Clean Solid Ring -->
  <circle cx="300" cy="340" r="76" fill="#22D3EE" fill-opacity="0.18" stroke="#FFFFFF" stroke-width="4" />
  <text x="300" y="348" font-family="sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle">BORDE PURO</text>

  <!-- Bottom Info Pill -->
  <rect x="95" y="472" width="410" height="50" rx="12" fill="#181C24" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.5" />
  <text x="300" y="503" font-family="monospace" font-weight="800" font-size="16" fill="#67E8F9" text-anchor="middle">✓ CERO FILTRACIÓN DE BASE BLANCA DTF</text>

  <!-- Bottom CTA Button -->
  <rect x="90" y="595" width="420" height="76" rx="20" fill="#FFFFFF" />
  <text x="300" y="642" font-family="sans-serif" font-weight="900" font-size="24" fill="#0A0B0E" text-anchor="middle" letter-spacing="1">LIMPIAR BORDES AHORA →</text>
</svg>
