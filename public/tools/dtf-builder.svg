<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181D" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#1A1C23" />
      <rect x="10" y="10" width="10" height="10" fill="#1A1C23" />
      <rect x="10" width="10" height="10" fill="#12141A" />
      <rect y="10" width="10" height="10" fill="#12141A" />
    </pattern>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8E95A5" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Technical Canvas Area with Grid -->
  <rect x="40" y="40" width="520" height="520" rx="20" fill="#0D0E11" stroke="#20232A" stroke-width="2" />
  <rect x="60" y="60" width="480" height="380" rx="14" fill="url(#grid)" stroke="#262A36" stroke-width="1.5" />

  <!-- DTF Platen Sheet (58 cm gang sheet preview) -->
  <rect x="90" y="90" width="420" height="320" rx="10" fill="#0D0E11" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Layout items placed on film -->
  <rect x="110" y="110" width="170" height="130" rx="8" fill="#16181D" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="160" cy="175" r="32" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="2" />
  <text x="160" y="180" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">PECHO</text>
  <text x="235" y="170" font-family="monospace" font-size="10" fill="#8E95A5">300 DPI</text>
  <text x="235" y="190" font-family="monospace" font-size="10" fill="#FFFFFF">10×10 cm</text>

  <!-- Item 2 on film -->
  <rect x="300" y="110" width="190" height="280" rx="8" fill="#16181D" stroke="#FFFFFF" stroke-width="1.5" />
  <rect x="320" y="130" width="150" height="190" rx="6" fill="#0D0E11" stroke="#20232A" />
  <path d="M 395 190 L 430 250 L 360 250 Z" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="2" />
  <text x="395" y="300" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">ESPALDA A3</text>
  <text x="395" y="318" font-family="monospace" font-size="10" fill="#8E95A5" text-anchor="middle">28 × 38 cm</text>

  <!-- Item 3 on film -->
  <rect x="110" y="260" width="170" height="130" rx="8" fill="#16181D" stroke="#FFFFFF" stroke-width="1.5" />
  <text x="195" y="325" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">GORRA / MANGA</text>
  <text x="195" y="345" font-family="monospace" font-size="10" fill="#8E95A5" text-anchor="middle">12 × 5 cm</text>

  <!-- Technical Overlay Footer -->
  <rect x="60" y="460" width="480" height="80" rx="12" fill="#16181D" stroke="#20232A" stroke-width="1.5" />
  <text x="85" y="495" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">ARMADOR DE METROS DTF</text>
  <text x="85" y="522" font-family="monospace" font-size="12" fill="#8E95A5">BOBINA 58.0 CM • METRO (100 CM) Y DOBLE METRO (200 CM)</text>

  <!-- Badge 300 DPI -->
  <rect x="420" y="478" width="105" height="42" rx="8" fill="#FFFFFF" />
  <text x="472" y="504" font-family="sans-serif" font-weight="900" font-size="13" fill="#000000" text-anchor="middle">300 DPI</text>
</svg>
