<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181D" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>
    <pattern id="gridAlpha2" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#1A1C23" />
      <rect x="12" y="12" width="12" height="12" fill="#1A1C23" />
      <rect x="12" width="12" height="12" fill="#12141A" />
      <rect y="12" width="12" height="12" fill="#12141A" />
    </pattern>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad5)" />

  <rect x="40" y="40" width="520" height="520" rx="20" fill="#0D0E11" stroke="#20232A" stroke-width="2" />

  <!-- Showcase Box -->
  <rect x="60" y="60" width="480" height="380" rx="14" fill="#16181D" stroke="#262A36" stroke-width="1.5" />

  <!-- Targeted Color Swatches -->
  <circle cx="170" cy="190" r="55" fill="#EF4444" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="300" cy="160" r="55" fill="#000000" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="430" cy="190" r="55" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" />

  <!-- Target Dropper Ring on Center Circle -->
  <circle cx="300" cy="160" r="75" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6,4" />
  
  <!-- Dropper Pipette Icon pointing down-right -->
  <g transform="translate(250, 110)">
    <line x1="80" y1="20" x2="50" y2="50" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
    <polygon points="50,50 35,65 30,85 50,80 65,65" fill="#FFFFFF" />
    <circle cx="85" cy="15" r="12" fill="#FFFFFF" />
  </g>

  <!-- Output Arrow to Transparent Cutout -->
  <path d="M 300 245 L 300 280" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <polygon points="300,295 292,278 308,278" fill="#FFFFFF" />

  <!-- Result Alpha Pocket -->
  <rect x="180" y="305" width="240" height="100" rx="12" fill="url(#gridAlpha2)" stroke="#FFFFFF" stroke-width="2" />
  <text x="300" y="352" font-family="sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">FONDO EXTRAÍDO</text>
  <text x="300" y="375" font-family="monospace" font-size="11" fill="#8E95A5" text-anchor="middle">Tolerancia de matiz calibrable</text>

  <!-- Technical Overlay Footer -->
  <rect x="60" y="460" width="480" height="80" rx="12" fill="#16181D" stroke="#20232A" stroke-width="1.5" />
  <text x="85" y="495" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">BORRADO POR GOTERO DIRECTO</text>
  <text x="85" y="522" font-family="monospace" font-size="12" fill="#8E95A5">ELIMINA COLORES MOLESTOS (NEGRO, BLANCO O ROJO)</text>

  <rect x="420" y="478" width="105" height="42" rx="8" fill="#FFFFFF" />
  <text x="472" y="504" font-family="sans-serif" font-weight="900" font-size="13" fill="#000000" text-anchor="middle">GOTERO</text>
</svg>
