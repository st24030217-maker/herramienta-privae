<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0B0D11" stop-opacity="0.96" />
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>
    <pattern id="alphaGrid5" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#252934" />
      <rect x="14" y="14" width="14" height="14" fill="#252934" />
      <rect x="14" width="14" height="14" fill="#151820" />
      <rect y="14" width="14" height="14" fill="#151820" />
    </pattern>
  </defs>

  <!-- Card Base -->
  <rect x="4" y="4" width="592" height="712" rx="28" fill="url(#cardBg5)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3" />
  <circle cx="300" cy="340" r="240" fill="url(#glow5)" />

  <!-- Top Category Pill -->
  <rect x="155" y="38" width="290" height="38" rx="19" fill="#EC4899" fill-opacity="0.15" stroke="#F472B6" stroke-opacity="0.6" stroke-width="1.5" />
  <circle cx="184" cy="57" r="6" fill="#F472B6" />
  <text x="312" y="63" font-family="sans-serif" font-weight="800" font-size="16" fill="#FBCFE8" text-anchor="middle" letter-spacing="1.5">GOTERO QUITA-COLOR</text>

  <!-- Giant Title -->
  <text x="300" y="132" font-family="sans-serif" font-weight="900" font-size="45" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">BORRAR UN COLOR</text>
  <text x="300" y="168" font-family="sans-serif" font-weight="600" font-size="21" fill="#9CA3AF" text-anchor="middle">Toca cualquier color para volverlo transparente</text>

  <!-- Central Visual Illustration: Target Crosshair & Color Extraction -->
  <rect x="65" y="200" width="470" height="350" rx="20" fill="url(#alphaGrid5)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />

  <!-- Target Ring -->
  <circle cx="300" cy="345" r="88" fill="#14171F" stroke="#F472B6" stroke-width="3.5" />
  <circle cx="300" cy="345" r="52" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8,6" />
  <line x1="190" y1="345" x2="410" y2="345" stroke="#F472B6" stroke-width="2" />
  <line x1="300" y1="235" x2="300" y2="455" stroke="#F472B6" stroke-width="2" />
  <circle cx="300" cy="345" r="14" fill="#F472B6" />

  <!-- Tolerance Bar at Bottom of Canvas -->
  <rect x="105" y="468" width="390" height="54" rx="12" fill="#111318" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
  <text x="300" y="501" font-family="monospace" font-weight="800" font-size="17" fill="#FFFFFF" text-anchor="middle">1 CLIC = COLOR ELIMINADO AL 100%</text>

  <!-- Bottom CTA Button -->
  <rect x="90" y="595" width="420" height="76" rx="20" fill="#FFFFFF" />
  <text x="300" y="642" font-family="sans-serif" font-weight="900" font-size="24" fill="#0A0B0E" text-anchor="middle" letter-spacing="1">USAR GOTERO AHORA →</text>
</svg>
